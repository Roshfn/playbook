spring:
  application:
    name: auth-service
  auth:
    oidc:
      google:
        client-ids: ${GOOGLE_CLIENT_IDS}
      apple:
        client-ids: ${APPLE_CLIENT_IDS}
    otp:
      pepper: ${OTP_PEPPER}

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_service
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE