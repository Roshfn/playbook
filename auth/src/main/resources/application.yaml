spring:
  application:
    name: auth-service
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_service
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

auth:
  oidc:
    google:
      client-ids: ${GOOGLE_CLIENT_IDS:dummy-google}
    apple:
      enabled: false
      client-ids: ${APPLE_CLIENT_IDS:dummy-apple}
  otp:
    pepper: ${OTP_PEPPER:dev-pepper-change-me}
  jwt:
    issuer: ${JWT_ISSUER:https://auth.playbook.com}
    key-id: auth-key-1
    private-key: ${JWT_PRIVATE_KEY:file:./keys/private.pem}
    public-key: ${JWT_PUBLIC_KEY:file:./keys/public.pem}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 2592000

server:
  port: 8080

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE